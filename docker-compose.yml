# Base de datos local de desarrollo: PostgreSQL 17 con la extensión pgvector (para los embeddings del RAG).
# Las credenciales salen de .env.local (ver .env.example): npm run db:up se lo pasa con --env-file.
services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    container_name: memnon-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env.local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env.local}
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en .env.local}
    ports:
      # Solo en localhost: la base de datos no es accesible desde otras máquinas de la red.
      - "127.0.0.1:5432:5432"
    volumes:
      - memnon-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  memnon-db-data:
